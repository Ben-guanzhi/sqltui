name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build for Linux AMD64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/LinPr/sqltui/cmd.Version=${{ steps.version.outputs.VERSION }}" -o dist/sqltui-linux-amd64 .

      - name: Build for Linux ARM64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/LinPr/sqltui/cmd.Version=${{ steps.version.outputs.VERSION }}" -o dist/sqltui-linux-arm64 .

      - name: Build for Windows AMD64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/LinPr/sqltui/cmd.Version=${{ steps.version.outputs.VERSION }}" -o dist/sqltui-windows-amd64.exe .

      - name: Build for Windows ARM64
        run: GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/LinPr/sqltui/cmd.Version=${{ steps.version.outputs.VERSION }}" -o dist/sqltui-windows-arm64.exe .

      - name: Build for macOS AMD64
        run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/LinPr/sqltui/cmd.Version=${{ steps.version.outputs.VERSION }}" -o dist/sqltui-darwin-amd64 .

      - name: Build for macOS ARM64
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/LinPr/sqltui/cmd.Version=${{ steps.version.outputs.VERSION }}" -o dist/sqltui-darwin-arm64 .

      - name: Create checksums
        run: sha256sum dist/sqltui-* > dist/checksums.txt

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --detach-sign --armor --output dist/checksums.txt.asc dist/checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v3
        with:
          output: dist/sbom.spdx.json
          format: spdx-json
          artifact-type: project

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: sqltui ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
